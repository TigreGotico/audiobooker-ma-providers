[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "audiobooker-ma-providers"
dynamic = ["version"]
description = "Per-source audiobook providers for Music Assistant via audiobooker"
license = "Apache-2.0"
license-files = ["LICENSE"]
requires-python = ">=3.12"
dependencies = ["music-assistant-plugin-manager", "music-assistant-models>=1.1.206", "audiobooker>=0.9.0a3", "yt-dlp>=2024.1.0"]

[project.optional-dependencies]
test = ["pytest", "pytest-asyncio"]

[tool.pytest.ini_options]
testpaths = ["test"]
asyncio_mode = "auto"

[project.entry-points."music_assistant.provider"]
librivox               = "audiobooker_ma_providers.librivox"
loyalbooks             = "audiobooker_ma_providers.loyalbooks"
darkerprojects         = "audiobooker_ma_providers.darkerprojects"
audioanarchy           = "audiobooker_ma_providers.audioanarchy"
goldenaudiobooks       = "audiobooker_ma_providers.goldenaudiobooks"
stephenkingaudiobooks  = "audiobooker_ma_providers.stephenkingaudiobooks"
hpaudiotales           = "audiobooker_ma_providers.hpaudiotales"
thecybrarian           = "audiobooker_ma_providers.thecybrarian"
horrorbabble           = "audiobooker_ma_providers.horrorbabble"
audiobooker_index      = "audiobooker_ma_providers.audiobooker_index"

[tool.setuptools.dynamic]
version = { attr = "audiobooker_ma_providers.version.__version__" }

[tool.setuptools.packages.find]
include = ["audiobooker_ma_providers*"]

[tool.setuptools.package-data]
audiobooker_ma_providers = ["*/manifest.json"]
